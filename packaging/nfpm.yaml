# nfpm (https://nfpm.goreleaser.com) builds .deb, .rpm and .apk from this one file.
#   VERSION=1.3.0 ARCH=amd64 nfpm package -p deb -t dist/
# The binary is expected at dist/linux/${ARCH}/roomy (see packaging/scripts/build-linux.sh).
name: roomy
arch: "${ARCH}"
platform: linux
version: "${VERSION}"
section: utils
priority: optional
maintainer: Azbouki <hello@getroomy.dev>
description: |
  Roomy finds and removes regenerable developer and AI-agent artifacts:
  node_modules, virtualenvs, build caches, model stores, agent session leftovers.
  Dry-run first, plan-file deletion, quarantine with retention, tamper-evident
  audit log and Prometheus metrics for fleets of agent hosts, plus Roomy Hub:
  a central inventory and dashboard every host reports to.
vendor: Azbouki
homepage: https://getroomy.dev
license: Proprietary
depends:
  - coreutils
recommends:
  - git
contents:
  - src: dist/linux/${ARCH}/roomy
    dst: /usr/bin/roomy
    file_info:
      mode: 0755
  - src: packaging/systemd/roomy-fleet@.service
    dst: /usr/lib/systemd/system/roomy-fleet@.service
  - src: packaging/systemd/roomy-fleet@.timer
    dst: /usr/lib/systemd/system/roomy-fleet@.timer
  - src: packaging/systemd/roomy-fleet-serve@.service
    dst: /usr/lib/systemd/system/roomy-fleet-serve@.service
  - src: packaging/systemd/roomy-hub.service
    dst: /usr/lib/systemd/system/roomy-hub.service
  - src: packaging/config/hub.env
    dst: /etc/roomy/hub.env
    type: config|noreplace
  - src: packaging/config/policy.agent-host.json
    dst: /etc/roomy/policy.json
    type: config|noreplace
  - src: docs/cli.md
    dst: /usr/share/doc/roomy/cli.md
  - src: docs/fleet.md
    dst: /usr/share/doc/roomy/fleet.md
  - src: docs/hub.md
    dst: /usr/share/doc/roomy/hub.md
  - src: LICENSE
    dst: /usr/share/doc/roomy/LICENSE
scripts:
  postinstall: packaging/scripts/postinstall.sh
